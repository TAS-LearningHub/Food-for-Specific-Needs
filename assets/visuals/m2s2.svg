<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="630" viewBox="0 0 1120 630" role="img" aria-labelledby="t d"><title id="t">Religious and ethical food choices</title><desc id="d">Purpose-built concept diagram for Religious and ethical food choices</desc><rect width="1120" height="630" fill="#eef4ed"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5b8f67"/></marker></defs><text x="70" y="76" font-family="Georgia,serif" font-size="42" font-weight="700" fill="#243229">Religious and ethical food choices</text><text x="70" y="122" font-family="Segoe UI,sans-serif" font-size="21" fill="#4d5d53">Use the evidence in this section before making a food decision.</text><rect x="90" y="180" width="285" height="190" rx="22" fill="#fffdf8" stroke="#2f6b4f" stroke-width="5"/><circle cx="124" cy="218" r="15" fill="#2f6b4f"/><foreignObject x="148" y="197" width="209" height="52"><div xmlns="http://www.w3.org/1999/xhtml" style="font:700 21px/1.15 Segoe UI,sans-serif;color:#243229">Religious Food Practice</div></foreignObject><foreignObject x="115" y="258" width="235" height="98"><div xmlns="http://www.w3.org/1999/xhtml" style="font:19px/1.32 Segoe UI,sans-serif;color:#243229">may affect ingredients, timing, preparation or certification</div></foreignObject><rect x="415" y="238" width="285" height="190" rx="22" fill="#fffdf8" stroke="#924d5b" stroke-width="5"/><circle cx="449" cy="276" r="15" fill="#924d5b"/><foreignObject x="473" y="255" width="209" height="52"><div xmlns="http://www.w3.org/1999/xhtml" style="font:700 21px/1.15 Segoe UI,sans-serif;color:#243229">Ethical Choice</div></foreignObject><foreignObject x="440" y="316" width="235" height="98"><div xmlns="http://www.w3.org/1999/xhtml" style="font:19px/1.32 Segoe UI,sans-serif;color:#243229">may respond to concerns such as animals, labour or environment</div></foreignObject><rect x="740" y="296" width="285" height="190" rx="22" fill="#fffdf8" stroke="#d4a945" stroke-width="5"/><circle cx="774" cy="334" r="15" fill="#d4a945"/><foreignObject x="798" y="313" width="209" height="52"><div xmlns="http://www.w3.org/1999/xhtml" style="font:700 21px/1.15 Segoe UI,sans-serif;color:#243229">Transparent Service</div></foreignObject><foreignObject x="765" y="374" width="235" height="98"><div xmlns="http://www.w3.org/1999/xhtml" style="font:19px/1.32 Segoe UI,sans-serif;color:#243229">makes ingredients and process information available</div></foreignObject><path d="M375 280 L415 300 M700 340 L740 360" stroke="#5b8f67" stroke-width="7" marker-end="url(#a)"/><text x="70" y="590" font-family="Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#2f6b4f">CONTEXT → EVIDENCE → RESPECTFUL CONCLUSION</text></svg>