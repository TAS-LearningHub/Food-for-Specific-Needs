<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="630" viewBox="0 0 1120 630" role="img" aria-labelledby="t d"><title id="t">Meal planning for a specific circumstance</title><desc id="d">Purpose-built concept diagram for Meal planning for a specific circumstance</desc><rect width="1120" height="630" fill="#eef4ed"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5b8f67"/></marker></defs><text x="70" y="76" font-family="Georgia,serif" font-size="42" font-weight="700" fill="#243229">Meal planning for a specific circumstance</text><text x="70" y="122" font-family="Segoe UI,sans-serif" font-size="21" fill="#4d5d53">Use the evidence in this section before making a food decision.</text><path d="M370 315 H420 M720 315 H770" stroke="#5b8f67" stroke-width="7" marker-end="url(#a)"/><rect x="70" y="205" width="300" height="220" rx="22" fill="#fffdf8" stroke="#2f6b4f" stroke-width="5"/><circle cx="104" cy="243" r="15" fill="#2f6b4f"/><foreignObject x="128" y="222" width="224" height="52"><div xmlns="http://www.w3.org/1999/xhtml" style="font:700 21px/1.15 Segoe UI,sans-serif;color:#243229">Design Brief</div></foreignObject><foreignObject x="95" y="283" width="250" height="128"><div xmlns="http://www.w3.org/1999/xhtml" style="font:19px/1.32 Segoe UI,sans-serif;color:#243229">a clear statement of the person, need and constraints</div></foreignObject><rect x="420" y="205" width="300" height="220" rx="22" fill="#fffdf8" stroke="#924d5b" stroke-width="5"/><circle cx="454" cy="243" r="15" fill="#924d5b"/><foreignObject x="478" y="222" width="224" height="52"><div xmlns="http://www.w3.org/1999/xhtml" style="font:700 21px/1.15 Segoe UI,sans-serif;color:#243229">Balanced Planning</div></foreignObject><foreignObject x="445" y="283" width="250" height="128"><div xmlns="http://www.w3.org/1999/xhtml" style="font:19px/1.32 Segoe UI,sans-serif;color:#243229">considers variety and food-group contribution across the plan</div></foreignObject><rect x="770" y="205" width="300" height="220" rx="22" fill="#fffdf8" stroke="#d4a945" stroke-width="5"/><circle cx="804" cy="243" r="15" fill="#d4a945"/><foreignObject x="828" y="222" width="224" height="52"><div xmlns="http://www.w3.org/1999/xhtml" style="font:700 21px/1.15 Segoe UI,sans-serif;color:#243229">Evaluation</div></foreignObject><foreignObject x="795" y="283" width="250" height="128"><div xmlns="http://www.w3.org/1999/xhtml" style="font:19px/1.32 Segoe UI,sans-serif;color:#243229">checks the proposal against the original brief and evidence</div></foreignObject><text x="70" y="590" font-family="Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#2f6b4f">PERSON → INFLUENCE → DESIGN RESPONSE</text></svg>