<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="630" viewBox="0 0 1120 630" role="img" aria-labelledby="t d"><title id="t">Allergy versus intolerance</title><desc id="d">Purpose-built concept diagram for Allergy versus intolerance</desc><rect width="1120" height="630" fill="#eef4ed"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5b8f67"/></marker></defs><text x="70" y="76" font-family="Georgia,serif" font-size="42" font-weight="700" fill="#243229">Allergy versus intolerance</text><text x="70" y="122" font-family="Segoe UI,sans-serif" font-size="21" fill="#4d5d53">Use the evidence in this section before making a food decision.</text><rect x="90" y="175" width="430" height="190" rx="22" fill="#fffdf8" stroke="#2f6b4f" stroke-width="5"/><circle cx="124" cy="213" r="15" fill="#2f6b4f"/><foreignObject x="148" y="192" width="354" height="52"><div xmlns="http://www.w3.org/1999/xhtml" style="font:700 21px/1.15 Segoe UI,sans-serif;color:#243229">Food Allergy</div></foreignObject><foreignObject x="115" y="253" width="380" height="98"><div xmlns="http://www.w3.org/1999/xhtml" style="font:19px/1.32 Segoe UI,sans-serif;color:#243229">an immune-system reaction that can be life-threatening</div></foreignObject><rect x="600" y="175" width="430" height="190" rx="22" fill="#fffdf8" stroke="#924d5b" stroke-width="5"/><circle cx="634" cy="213" r="15" fill="#924d5b"/><foreignObject x="658" y="192" width="354" height="52"><div xmlns="http://www.w3.org/1999/xhtml" style="font:700 21px/1.15 Segoe UI,sans-serif;color:#243229">Food Intolerance</div></foreignObject><foreignObject x="625" y="253" width="380" height="98"><div xmlns="http://www.w3.org/1999/xhtml" style="font:19px/1.32 Segoe UI,sans-serif;color:#243229">a different type of adverse reaction that still requires accurate information</div></foreignObject><rect x="345" y="390" width="430" height="155" rx="22" fill="#fffdf8" stroke="#d4a945" stroke-width="5"/><circle cx="379" cy="428" r="15" fill="#d4a945"/><foreignObject x="403" y="407" width="354" height="52"><div xmlns="http://www.w3.org/1999/xhtml" style="font:700 21px/1.15 Segoe UI,sans-serif;color:#243229">Student Role</div></foreignObject><foreignObject x="370" y="468" width="380" height="63"><div xmlns="http://www.w3.org/1999/xhtml" style="font:19px/1.32 Segoe UI,sans-serif;color:#243229">follow verified plans and school procedures without diagnosing</div></foreignObject><path d="M305 370 L470 410 M815 370 L650 410" stroke="#924d5b" stroke-width="7" marker-end="url(#a)"/><text x="70" y="590" font-family="Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#2f6b4f">VERIFY THE NEED → CONTROL THE PATHWAY → STOP IF UNSURE</text></svg>