n<br/><span style="font-weight:400;font-size:15px;line-height:1.2">fits time, access, skills and the verified need</span></div></foreignObject><text x="70" y="590" font-family="Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#2f6b4f">STAGE → REASON → PRACTICAL RESPONSE</text></svg>