<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="630" viewBox="0 0 1120 630" role="img" aria-labelledby="t d"><title id="t">Dietary fibre and adolescent needs</title><desc id="d">Purpose-built concept diagram for Dietary fibre and adolescent needs</desc><rect width="1120" height="630" fill="#eef4ed"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5b8f67"/></marker></defs><text x="70" y="76" font-family="Georgia,serif" font-size="42" font-weight="700" fill="#243229">Dietary fibre and adolescent needs</text><text x="70" y="122" font-family="Segoe UI,sans-serif" font-size="21" fill="#4d5d53">Use the evidence in this section before making a food decision.</text><circle cx="560" cy="332" r="92" fill="#203c2e"/><text x="560" y="322" text-anchor="middle" fill="white" font-size="23" font-weight="700">PERSON</text><text x="560" y="352" text-anchor="middle" fill="white" font-size="20">AND NEED</text><rect x="55" y="180" width="300" height="160" rx="22" fill="#fffdf8" stroke="#2f6b4f" stroke-width="5"/><circle cx="89" cy="218" r="15" fill="#2f6b4f"/><foreignObject x="113" y="197" width="224" height="52"><div xmlns="http://www.w3.org/1999/xhtml" style="font:700 21px/1.15 Segoe UI,sans-serif;color:#243229">Dietary Fibre</div></foreignObject><foreignObject x="80" y="258" width="250" height="68"><div xmlns="http://www.w3.org/1999/xhtml" style="font:19px/1.32 Segoe UI,sans-serif;color:#243229">plant material not completely broken down in the small intestine</div></foreignObject><rect x="410" y="405" width="300" height="160" rx="22" fill="#fffdf8" stroke="#924d5b" stroke-width="5"/><circle cx="444" cy="443" r="15" fill="#924d5b"/><foreignObject x="468" y="422" width="224" height="52"><div xmlns="http://www.w3.org/1999/xhtml" style="font:700 21px/1.15 Segoe UI,sans-serif;color:#243229">Fibre Sources</div></foreignObject><foreignObject x="435" y="483" width="250" height="68"><div xmlns="http://www.w3.org/1999/xhtml" style="font:19px/1.32 Segoe UI,sans-serif;color:#243229">wholegrains, legumes, vegetables, fruit, nuts and seeds</div></foreignObject><rect x="765" y="180" width="300" height="160" rx="22" fill="#fffdf8" stroke="#d4a945" stroke-width="5"/><circle cx="799" cy="218" r="15" fill="#d4a945"/><foreignObject x="823" y="197" width="224" height="52"><div xmlns="http://www.w3.org/1999/xhtml" style="font:700 21px/1.15 Segoe UI,sans-serif;color:#243229">Reference Value</div></foreignObject><foreignObject x="790" y="258" width="250" height="68"><div xmlns="http://www.w3.org/1999/xhtml" style="font:19px/1.32 Segoe UI,sans-serif;color:#243229">population guidance that needs individual context</div></foreignObject><path d="M355 265 L470 315 M650 405 L610 375 M920 340 L650 345" stroke="#5b8f67" stroke-width="6" marker-end="url(#a)"/><text x="70" y="590" font-family="Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#2f6b4f">MATCH THE SUPPORT OR MODIFICATION TO THE ACTUAL NEED</text></svg>